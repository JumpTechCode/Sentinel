# Defaults loaded for env=dev when env vars are absent.
# Real secrets must come from environment, not from this file.
kafka_topic_incidents: sentinel.incidents
log_level: INFO
http_host: 127.0.0.1
http_port: 8000
llm_audit_log_path: logs/llm-audit.log

# Diagnosis agent (Work Area G)
diagnosis_consumer_enabled: true
diagnosis_prompt_version: v1
diagnosis_max_input_tokens: 12000
diagnosis_max_output_tokens: 2048
diagnosis_llm_timeout_seconds: 30.0
kafka_consumer_group_diagnoser: sentinel-diagnoser

# Webhook secrets — set via env for dev. YAML keys present so the loader sees them.
sentry_webhook_secret: null
pagerduty_webhook_secret: null
datadog_webhook_secret: null
generic_webhook_secret: null
