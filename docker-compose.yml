# Sentinel local stack. `make compose-up` waits for healthchecks.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sentinel_redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - sentinel_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sentinel-api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SENTINEL_ENV: dev
      SENTINEL_POSTGRES_DSN: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_KAFKA_BROKERS: kafka:9092
      SENTINEL_ANTHROPIC_API_KEY: ${SENTINEL_ANTHROPIC_API_KEY:-sk-placeholder}
      SENTINEL_SENTRY_WEBHOOK_SECRET: ${SENTINEL_SENTRY_WEBHOOK_SECRET:-}
      SENTINEL_PAGERDUTY_WEBHOOK_SECRET: ${SENTINEL_PAGERDUTY_WEBHOOK_SECRET:-}
      SENTINEL_DATADOG_WEBHOOK_SECRET: ${SENTINEL_DATADOG_WEBHOOK_SECRET:-}
      SENTINEL_GENERIC_WEBHOOK_SECRET: ${SENTINEL_GENERIC_WEBHOOK_SECRET:-}
      SENTINEL_HTTP_HOST: 0.0.0.0
      SENTINEL_HTTP_PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sentinel-worker"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SENTINEL_ENV: dev
      SENTINEL_POSTGRES_DSN: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_KAFKA_BROKERS: kafka:9092
      SENTINEL_ANTHROPIC_API_KEY: ${SENTINEL_ANTHROPIC_API_KEY:-sk-placeholder}
      SENTINEL_SENTRY_WEBHOOK_SECRET: ${SENTINEL_SENTRY_WEBHOOK_SECRET:-}
      SENTINEL_PAGERDUTY_WEBHOOK_SECRET: ${SENTINEL_PAGERDUTY_WEBHOOK_SECRET:-}
      SENTINEL_DATADOG_WEBHOOK_SECRET: ${SENTINEL_DATADOG_WEBHOOK_SECRET:-}
      SENTINEL_GENERIC_WEBHOOK_SECRET: ${SENTINEL_GENERIC_WEBHOOK_SECRET:-}

volumes:
  sentinel_pg:
  sentinel_redis:
  sentinel_kafka:
