      message: "Networking devices between internal and main network saturated; retry storm detected — backoff not engaging"
ground_truth:
  category: capacity
  acceptable_categories:
    - capacity
    - dependency
  root_cause: >
    An automated capacity scaling activity for an internal AWS service triggered
    a large surge of connection attempts from internal network clients. A latent
    bug in the clients' backoff logic prevented throttling under congestion,
    creating a feedback loop that saturated the networking devices bridging the
    internal and main AWS networks. This knocked out DNS, monitoring, and
    authorization services, cascading failures across EC2, RDS, ELB, STS, API
    Gateway, and other us-east-1 services for several hours.
  correct_actions:
    - Disable or roll back the triggering automated scaling activity immediately
    - Isolate high-connection-rate internal clients onto dedicated network devices
    - Add network capacity to the saturated internal-to-main bridge segment
    - Deploy network device protections (rate limits, connection caps) to arrest the surge
    - Patch and redeploy the defective client backoff/retry logic across internal services
    - Redirect internal DNS traffic to unaffected paths to restore dependent services first
