id: aws-2021-12-07-useast1
corpus_version: 1
source_url: https://aws.amazon.com/message/12721/
sources_consulted:
  - https://aws.amazon.com/message/12721/
notes: >
  AWS us-east-1 outage on December 7 2021 caused by a capacity scaling
  activity that triggered a surge of internal network connections, overwhelming
  networking devices between the internal and main AWS networks. A latent bug
  in client backoff logic amplified the congestion into a multi-hour cascade.
alert:
