  service: roblox-game-discovery
  severity: SEV1
  title: "Game-server discovery returning empty results; backend API p99 > 30s"
  timestamp: "2021-10-28T20:00:00Z"
  raw_payload:
    check: game_discovery_health
    p99_latency_ms: 34200
    healthy_backends: 0
    consul_kv_write_latency_ms: 2800
    alert_id: "sev1-2021-10-28-001"
context_seed:
