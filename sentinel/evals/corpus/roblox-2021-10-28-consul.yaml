id: roblox-2021-10-28-consul
corpus_version: 1
source_url: https://blog.roblox.com/2022/01/roblox-return-to-service-10-28-10-31-2021/
sources_consulted:
  - https://blog.roblox.com/2022/01/roblox-return-to-service-10-28-10-31-2021/
notes: >
  73-hour outage caused by two compounding Consul pathologies: streaming-feature
  contention on a shared Go channel under high read+write load, and a BoltDB
  freelist bug where a 16KB write triggered a 7.8MB freelist flush (2-3s latency).
  Recovery required disabling streaming, restoring from snapshot, and gradual
  DNS-steered player re-admission.
