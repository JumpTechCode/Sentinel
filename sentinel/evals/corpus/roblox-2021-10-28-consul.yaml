      pr_title: "Enable Consul streaming on traffic-routing service"
      pr_diff_summary: >
        Enabled Consul streaming feature flag on traffic-routing service;
        concurrent node count increased ~50% to support additional game-streaming
        capacity. Upgrade leverages Consul 1.10 streaming (vs. prior long-polling).
      deployed_at: "2021-10-27T14:00:00Z"
