ground_truth:
  category: capacity
  acceptable_categories:
    - capacity
    - dependency
  root_cause: >
    Enabling Consul streaming on the traffic-routing service (with a simultaneous
    50% node-count increase) created high concurrent read+write load that exposed
    two bugs: (1) streaming's reduced Go-channel concurrency controls caused write
    blocking under combined load; (2) BoltDB's freelist was never compacted after
    snapshots, so a 16KB Raft write triggered a 7.8MB freelist flush, causing
    2-3s commit latency and cascading TCP backpressure across all Consul-dependent
    services—taking the entire platform offline for 73 hours.
  correct_actions:
    - "Immediately disable Consul streaming feature flag across all services"
    - "Restore Consul cluster from pre-outage snapshot with iptables rate-limiting on reconnect"
    - "Compact or truncate BoltDB Raft log store to eliminate oversized freelist"
    - "Shard Consul cluster so critical services have dedicated instances"
    - "Remove circular telemetry dependency on Consul to enable safe cluster restarts"
    - "Migrate BoltDB to bbolt with freelist pre-loading disabled"
    - "Re-admit players gradually via DNS steering in 10% increments, monitoring DB and cache at each step"
