  similar_incidents:
    - id: similar:stripe-2019-07-08-db-lag
      title: "Charges DB replica lag spike — partial API slowdown"
      root_cause: >
        Replica fell behind during high write volume; promoted replica
        required 20-minute catch-up window before reads stabilised
      remediation: Manually rerouted reads to primary until lag cleared
ground_truth:
  category: dependency
  acceptable_categories:
    - dependency
    - capacity
  root_cause: >
    The primary MySQL database cluster underpinning Stripe's Charges API was
    operating near its maximum workload capacity. A planned replica promotion
    under sustained production load caused the newly elected primary to be
    immediately overwhelmed, triggering cascading replication lag across all
    replicas. Read traffic fanned out to lagged replicas, returning stale
    results and driving retry storms that amplified write pressure, producing
    a self-reinforcing degradation loop.
  correct_actions:
    - Shed non-critical read traffic and rate-limit retrying clients to reduce write amplification on the overloaded primary
    - Drain and pause webhook delivery workers to prevent queue-driven read storms from further loading the DB
    - Halt replica promotion under load; wait for replication lag < 5 s before cutting over reads to any replica
    - Instrument and alert on replication lag as a leading indicator before API error rate climbs
    - Increase database cluster capacity (additional shards / horizontal scaling) before the next high-traffic window
    - Implement a capacity ceiling alert that fires before the database reaches its workload limit, not after a failover cascades
