name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff format --check sentinel tests
          ruff check sentinel tests

      - name: Typecheck (mypy --strict)
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"

      - name: Start compose stack
        run: docker compose up -d --wait postgres redis kafka

      - name: Integration tests
        env:
          SENTINEL_ENV: test
          SENTINEL_POSTGRES_DSN: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
          SENTINEL_REDIS_URL: redis://localhost:6379/0
          SENTINEL_KAFKA_BROKERS: localhost:29092
          SENTINEL_ANTHROPIC_API_KEY: sk-placeholder
        # Integration tests exercise external services, not internal code;
        # coverage is enforced by the unit job (--no-cov skips the addopts gate).
        run: pytest tests/integration -v -m integration --no-cov

      - name: Tear down
        if: always()
        run: docker compose down -v

  evals-smoke:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev]"
      - name: Evals smoke (placeholder until Work Area K)
        run: make evals-smoke
