[project]
name = "sentinel"
version = "0.0.0"
description = "AI on-call copilot — ingests alerts, assembles context, produces evidence-cited diagnoses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Arik Levinsky" }]
keywords = ["incident-response", "ai", "on-call", "diagnosis", "observability", "pgvector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "redis>=5.2,<5.3",
  "aiokafka>=0.12,<0.13",
  "anthropic>=0.39,<0.40",
  "httpx>=0.27,<0.28",
  "structlog>=24.4,<25",
  "prometheus-client>=0.21,<0.22",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
  "testcontainers[postgres,redis,kafka]>=4.8,<5",
  "locust>=2.32,<3",
  "types-pyyaml>=6.0,<7",
  "pre-commit>=4,<5",
]

[project.urls]
Homepage = "https://github.com/JumpTechCode/Sentinel"
Repository = "https://github.com/JumpTechCode/Sentinel"
Issues = "https://github.com/JumpTechCode/Sentinel/issues"

[project.scripts]
sentinel-api = "sentinel.api.app:run"
sentinel-worker = "sentinel.workers.diagnosis_worker:run"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["sentinel", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "B",
  "UP",
  "SIM",
  "TID",
  "RUF",
  "ASYNC",
  "S",
  "RET",
  "PIE",
  "PERF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM", "S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
show_error_codes = true
files = ["sentinel", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "asyncpg.*", "testcontainers.*", "locust.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=sentinel --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires docker-compose services (postgres, redis, kafka)",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
